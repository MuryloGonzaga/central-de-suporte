<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Central de Suporte WebRota</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Favicon Oficial WebRota -->
    <link rel="icon" type="image/png" href="/static/images/webrota-icon.png">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-page-container">
        <main class="login-main-wrapper">
            <div class="login-card-box">
                <div class="login-card-header">
                    <div class="login-card-logo-box" style="margin-bottom: 22px; display: flex; justify-content: center;">
                        <img src="/static/images/webrota-logo-darkbg.png" alt="WebRota" height="42" style="object-fit: contain;">
                    </div>
                    <div class="login-badge-pill">
                        <i class="fa-solid fa-lock"></i> Acesso Restrito
                    </div>
                    <h2>Entrar no Sistema</h2>
                    <p>Informe suas credenciais para acessar a Central de Suporte, consultas de frota e assistente técnico.</p>
                </div>

                {% if erro %}
                <div class="login-error-alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>{{ erro }}</span>
                </div>
                {% endif %}

                <form action="/login" method="POST" class="login-form">
                    <div class="form-group-login">
                        <label for="username">
                            <i class="fa-solid fa-user"></i> Usuário ou E-mail
                        </label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Digite seu usuário do sistema WebRota"
                            required
                            autofocus
                        >
                    </div>

                    <div class="form-group-login">
                        <label for="password">
                            <i class="fa-solid fa-key"></i> Senha
                        </label>
                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Digite sua senha do sistema WebRota"
                                required
                            >
                            <button type="button" class="btn-toggle-pass" id="btn-toggle-pass" title="Ver senha">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-webrota-primary btn-block-login">
                        <span>Acessar Central de Suporte</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div class="login-card-footer">
                    <div class="login-help-note">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>Autenticação direta com o sistema oficial WebRota • v2.0</span>
                    </div>
                    <div class="login-users-hint">
                        <small><i class="fa-solid fa-circle-check" style="color: #F97316;"></i> Utilize o mesmo login e senha que você já usa no sistema WebRota.</small>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const btnToggle = document.getElementById('btn-toggle-pass');
        const passInput = document.getElementById('password');
        if (btnToggle && passInput) {
            btnToggle.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                btnToggle.innerHTML = isPass ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
            });
        }
    </script>
</body>
</html>
