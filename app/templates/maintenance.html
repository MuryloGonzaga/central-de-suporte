<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema em Manutenção</title>
    <link rel="icon" type="image/png" href="/static/images/webrota-icon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #DC2626 0%, #991B1B 40%, #7F1D1D 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            position: relative;
        }

        /* Padrão decorativo de fundo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .maintenance-container {
            text-align: center;
            padding: 40px 28px;
            max-width: 620px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ícone animado de ferramentas */
        .maintenance-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 32px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.25);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 18px rgba(255, 255, 255, 0);
                transform: scale(1.04);
            }
        }

        .maintenance-icon svg {
            width: 48px;
            height: 48px;
            fill: #FFFFFF;
            opacity: 0.9;
        }

        .maintenance-title {
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 16px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        }

        .maintenance-subtitle {
            font-size: clamp(0.95rem, 2.5vw, 1.15rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            max-width: 480px;
            margin: 0 auto 36px;
        }

        /* Barra de progresso animada infinita */
        .progress-bar-track {
            width: 220px;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            margin: 0 auto 28px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 40%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            animation: loading 1.8s ease-in-out infinite;
        }

        @keyframes loading {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(350%); }
        }

        .maintenance-footer {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        .maintenance-footer strong {
            color: rgba(255, 255, 255, 0.75);
        }

        /* Logo sutil no topo */
        .maintenance-logo {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.35;
            z-index: 1;
        }

        .maintenance-logo img {
            height: 28px;
            filter: brightness(0) invert(1);
        }
    </style>
</head>
<body>
    <div class="maintenance-logo">
        <img src="/static/images/webrota-logo-darkbg.png" alt="WebRota">
    </div>

    <div class="maintenance-container">
        <div class="maintenance-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
            </svg>
        </div>

        <h1 class="maintenance-title">Sistema Bloquado</h1>

        <p class="maintenance-subtitle">
            As Máquinas Estão Paradas!
        </p>

        <div class="progress-bar-track">
            <div class="progress-bar-fill"></div>
        </div>

        <p class="maintenance-footer">
            <strong>Central de Suporte WebRota</strong> — BLOQUEADO
        </p>
    </div>
</body>
</html>
